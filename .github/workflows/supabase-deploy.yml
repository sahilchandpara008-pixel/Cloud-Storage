name: Supabase deploy

# Manual only. Database changes and Edge Functions are applied to the live
# project directly (Supabase dashboard / MCP), and the live migration history
# uses different version numbers than the files here, so an automatic
# `supabase db push` on every push would try to re-run old migrations. The
# Bunny step would also overwrite live secrets with empty values for any
# GitHub secret that is not set. Before running this by hand: add the
# secrets below and align the history with `supabase migration repair`.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Apply database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Edge Functions
        run: supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Set Bunny secrets for the Edge Functions
        run: |
          supabase secrets set \
            BUNNY_STREAM_LIBRARY_ID="$BUNNY_STREAM_LIBRARY_ID" \
            BUNNY_STREAM_API_KEY="$BUNNY_STREAM_API_KEY" \
            BUNNY_STREAM_TOKEN_KEY="$BUNNY_STREAM_TOKEN_KEY" \
            BUNNY_STREAM_HOST="$BUNNY_STREAM_HOST" \
            BUNNY_CLOUD_ZONE="$BUNNY_CLOUD_ZONE" \
            BUNNY_CLOUD_PASSWORD="$BUNNY_CLOUD_PASSWORD" \
            BUNNY_CLOUD_ENDPOINT="$BUNNY_CLOUD_ENDPOINT" \
            BUNNY_CLOUD_HOST="$BUNNY_CLOUD_HOST" \
            BUNNY_CLOUD_TOKEN_KEY="$BUNNY_CLOUD_TOKEN_KEY"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BUNNY_STREAM_LIBRARY_ID: ${{ secrets.BUNNY_STREAM_LIBRARY_ID }}
          BUNNY_STREAM_API_KEY: ${{ secrets.BUNNY_STREAM_API_KEY }}
          BUNNY_STREAM_TOKEN_KEY: ${{ secrets.BUNNY_STREAM_TOKEN_KEY }}
          BUNNY_STREAM_HOST: ${{ secrets.BUNNY_STREAM_HOST }}
          BUNNY_CLOUD_ZONE: ${{ secrets.BUNNY_CLOUD_ZONE }}
          BUNNY_CLOUD_PASSWORD: ${{ secrets.BUNNY_CLOUD_PASSWORD }}
          BUNNY_CLOUD_ENDPOINT: ${{ secrets.BUNNY_CLOUD_ENDPOINT }}
          BUNNY_CLOUD_HOST: ${{ secrets.BUNNY_CLOUD_HOST }}
          BUNNY_CLOUD_TOKEN_KEY: ${{ secrets.BUNNY_CLOUD_TOKEN_KEY }}
