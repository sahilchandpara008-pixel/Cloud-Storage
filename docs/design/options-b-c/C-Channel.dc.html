<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Option C · Channel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#FF9A4D}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E0F12; color: #F5F5F7; font-family: 'Nunito Sans', system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; background-image: radial-gradient(rgba(255,122,26,0.07) 1.2px, transparent 1.2px); background-size: 18px 18px"></div>

  <header style="position: relative; display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 8px; background: #17181C; border-bottom: 1px solid #23252B">
    <a href="C-Channels.dc.html" aria-label="Back" style="width: 44px; height: 44px; color: #F5F5F7; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
    <span style="width: 40px; height: 40px; border-radius: 50%; background: url(img/a1.jpg) center/cover"></span>
    <span style="flex: 1">
      <span style="display: block; font-size: 16px; font-weight: 800">Web Series</span>
      <span style="display: block; font-size: 12px; color: #9A9AA5">15K followers</span>
    </span>
    <button aria-label="Search in channel" style="width: 44px; height: 44px; border: 0; background: transparent; color: #F5F5F7; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
  </header>

  <div style="position: relative; display: flex; flex-direction: column; gap: 12px; padding: 12px 12px 0">
    <span style="align-self: center; padding: 3px 12px; border-radius: 12px; background: rgba(35,37,43,0.9); font-size: 12px; font-weight: 700; color: #C8C8D0">Latest posts</span>
    <sc-for list="{{posts}}" as="p" hint-placeholder-count="2">
      <div style="width: 300px; border-radius: 14px 14px 14px 4px; background: #1D1E23; overflow: hidden">
        <a href="C-Post.dc.html" style="position: relative; display: block; height: 168px; background: url({{p.img}}) center/cover">
          <span style="position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"></path></svg></span>
          <span style="position: absolute; left: 8px; top: 8px; padding: 2px 7px; border-radius: 8px; background: rgba(0,0,0,0.6); font-size: 11px; font-weight: 700">{{p.time}}</span>
          <sc-if value="{{p.premium}}" hint-placeholder-val="{{true}}"><span style="position: absolute; right: 8px; top: 8px; padding: 2px 7px; border-radius: 8px; background: {{accent}}; color: #000; font-size: 10px; font-weight: 900">PREMIUM · PREVIEW</span></sc-if>
        </a>
        <div style="padding: 8px 10px 8px">
          <p style="margin: 0; font-size: 15px; font-weight: 800">{{p.title}}</p>
          <p style="margin: 3px 0 0; font-size: 14px; line-height: 1.4; color: #D0D0D8">{{p.caption}} <a href="C-Post.dc.html" style="font-weight: 800; text-decoration: none">see more</a></p>
          <p style="margin: 6px 0 0; display: flex; justify-content: flex-end; align-items: center; gap: 4px; font-size: 11px; color: #8A8A94"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>{{p.views}}</p>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: #17181C; border-top: 1px solid #23252B; display: flex; align-items: center; justify-content: center">
    <button style="width: 100%; height: 64px; border: 0; background: transparent; color: {{accent}}; font: inherit; font-size: 16px; font-weight: 900; letter-spacing: 0.06em">JOIN CHANNEL</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF7A1A","options":["#FF7A1A","#F47521","#2AABEE","#F5B400"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#FF7A1A',
      posts: [
        { title: 'Midnight Run · Part 3', caption: 'The passenger finally talks. Watch the 2-minute preview now.', img: 'img/t2.jpg', time: '13:40', premium: true, views: '4.8K' },
        { title: 'Echo Peak · Behind the scenes', caption: 'How we filmed the mountain night shots.', img: 'img/t1.jpg', time: '6:12', premium: false, views: '2.1K' }
      ]
    };
  }
}
</script>
</body>
</html>
