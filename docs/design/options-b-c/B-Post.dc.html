<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Option B · Video details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B1016}
a{color:#FF9A4D}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B1016; color: #F2F4F7; font-family: Inter, system-ui, sans-serif">

  <div style="position: relative; height: 220px; background: url(img/h1.jpg) center/cover">
    <a href="B-Explore.dc.html" aria-label="Back" style="position: absolute; top: 12px; left: 12px; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
    <span style="position: absolute; left: 12px; bottom: 12px; padding: 3px 8px; border-radius: 4px; background: rgba(0,0,0,0.7); font-size: 11px; font-weight: 600">Preview · 2:00</span>
    <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.2)"><span style="display: block; width: 18%; height: 3px; background: {{accent}}"></span></span>
  </div>

  <div style="padding: 14px 16px 0">
    <h1 style="margin: 0; font-family: 'Bebas Neue', sans-serif; font-size: 40px; font-weight: 400; letter-spacing: 0.02em; line-height: 1">MIDNIGHT RUN</h1>
    <p style="margin: 6px 0 0; display: flex; gap: 10px; align-items: center; font-size: 13px; color: #A7B0BC">
      <span style="color: #46D369; font-weight: 700">New</span><span>2026</span><span>42m</span>
      <span style="padding: 0 5px; border: 1px solid #5B6574; border-radius: 3px; font-size: 11px">HD</span>
      <span style="padding: 1px 6px; border-radius: 3px; background: {{accent}}; color: #1A1005; font-size: 10px; font-weight: 800">PREMIUM</span>
    </p>

    <a href="Player.dc.html" style="margin-top: 14px; height: 44px; border-radius: 6px; background: #F2F4F7; color: #0B1016; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"></path></svg>Play preview</a>
    <a href="B-Premium.dc.html" style="margin-top: 8px; height: 44px; border-radius: 6px; background: #222C38; color: #F2F4F7; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{accent}}"><path d="m12 2 3 7 7 .6-5.3 4.7 1.6 7.2L12 17.8 5.7 21.5l1.6-7.2L2 9.6 9 9z"></path></svg>Watch full video with Premium</a>

    <p style="margin: 14px 0 0; font-size: 14px; line-height: 1.5; color: #D6DBE2">A late-night driver takes one last job across the city and finds the passenger is not who she says she is. <a href="#" style="font-weight: 600; text-decoration: none">more</a></p>
    <p style="margin: 8px 0 0; font-size: 12px; color: #7B8594">Channel: <a href="B-Channel.dc.html" style="color: #D6DBE2; text-decoration: none; font-weight: 600">Web Series</a></p>

    <div style="display: flex; gap: 34px; margin-top: 16px; padding-left: 8px">
      <span style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #A7B0BC"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2F4F7" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Join channel</span>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #A7B0BC"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2F4F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"></path></svg>Share</span>
    </div>

    <div style="display: flex; gap: 20px; margin-top: 16px; border-top: 1px solid #1C2530">
      <span style="padding-top: 10px; border-top: 3px solid {{accent}}; margin-top: -2px; font-size: 14px; font-weight: 700">Parts</span>
      <span style="padding-top: 12px; font-size: 14px; color: #7B8594">More like this</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 12px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="position: relative; flex: none; width: 124px; height: 70px; border-radius: 4px; background: url({{it.img}}) center/cover">
            <span style="position: absolute; left: 50%; top: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; border: 1.5px solid #fff; background: rgba(0,0,0,0.45)"></span>
          </span>
          <span style="flex: 1"><span style="display: block; font-size: 14px; font-weight: 600">{{it.title}}</span><span style="display: block; margin-top: 2px; font-size: 12px; color: #7B8594">{{it.time}}</span></span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF7A1A","options":["#FF7A1A","#E50914","#00A8E1","#F5B400"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#FF7A1A',
      items: [
        { title: '1. The pickup', time: '14m · preview available', img: 'img/t2.jpg' },
        { title: '2. Wrong turn', time: '13m · premium', img: 'img/t7.jpg' }
      ]
    };
  }
}
</script>
</body>
</html>
