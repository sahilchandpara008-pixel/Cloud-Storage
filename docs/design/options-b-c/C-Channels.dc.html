<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Option C · Channels</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#FF9A4D}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000; color: #F5F5F7; font-family: 'Nunito Sans', system-ui, sans-serif">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px">
    <h1 style="margin: 0; font-size: 24px; font-weight: 900">Channels</h1>
    <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: #23252B; color: #F5F5F7; font: inherit; font-size: 13px; font-weight: 800">+ New channel</button>
  </header>
  <div style="margin: 0 16px; height: 40px; border-radius: 20px; background: #1A1B20; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: #8A8A94; font-size: 15px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Search
  </div>
  <div style="display: flex; gap: 8px; padding: 12px 16px 6px; font-size: 13px; font-weight: 800">
    <span style="padding: 6px 14px; border-radius: 16px; background: {{accent}}; color: #000">All</span>
    <span style="padding: 6px 14px; border-radius: 16px; background: #1A1B20; color: #C8C8D0">Joined <b style="color: {{accent}}">3</b></span>
    <span style="padding: 6px 14px; border-radius: 16px; background: #1A1B20; color: #C8C8D0">Discover</span>
  </div>

  <ul style="list-style: none; margin: 0; padding: 0">
    <sc-for list="{{chats}}" as="c" hint-placeholder-count="8">
      <li>
        <a href="C-Channel.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 8px 16px; text-decoration: none; color: #F5F5F7">
          <span style="flex: none; width: 54px; height: 54px; border-radius: 50%; background: url({{c.img}}) center/cover"></span>
          <span style="flex: 1; min-width: 0; padding: 4px 0 12px; border-bottom: 1px solid #17181C">
            <span style="display: flex; align-items: center; gap: 6px">
              <span style="font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span>
              <sc-if value="{{c.premium}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="{{accent}}" aria-label="Has premium videos"><path d="M3 8l4 3 5-7 5 7 4-3-2 11H5z"></path></svg></sc-if>
            </span>
            <span style="display: flex; align-items: center; gap: 8px; margin-top: 2px">
              <span style="flex: 1; font-size: 14px; color: #9A9AA5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.last}}</span>
              <sc-if value="{{c.unread}}" hint-placeholder-val="{{true}}"><span style="min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: {{c.badge}}; color: #000; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center">{{c.unread}}</span></sc-if>
              <sc-if value="{{c.join}}" hint-placeholder-val="{{false}}"><span style="height: 26px; padding: 0 12px; border-radius: 13px; border: 1.5px solid {{accent}}; color: {{accent}}; font-size: 12px; font-weight: 900; display: flex; align-items: center">JOIN</span></sc-if>
            </span>
          </span>
        </a>
      </li>
    </sc-for>
  </ul>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 66px; background: #141519; border-top: 1px solid #23252B; display: flex; align-items: center; justify-content: space-around">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
      <a href="{{n.href}}" style="position: relative; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: {{n.color}}; font-size: 11px; font-weight: 800; text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"></path></svg>{{n.label}}</a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF7A1A","options":["#FF7A1A","#F47521","#2AABEE","#F5B400"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FF7A1A';
    const tabs = [
      ['Cloud', 'C-Explore.dc.html', 'M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 11a3.5 3.5 0 0 0 1 7z'],
      ['Feed', 'C-Explore.dc.html', 'M4 4h16v16H4zM4 9h16M9 4v5'],
      ['Explore', 'C-Explore.dc.html', 'M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z'],
      ['Channels', 'C-Channels.dc.html', 'M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z'],
      ['Profile', 'C-Explore.dc.html', 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1.5-4 4.5-6 8-6s6.5 2 8 6']
    ];
    const list = [
      { name: 'Web Series', img: 'img/a1.jpg', last: '🎬 Midnight Run · Part 3 is up', unread: '3', premium: true },
      { name: 'Comedy', img: 'img/a3.jpg', last: '😂 Friday stand-up special', unread: '1', premium: false },
      { name: 'Travel Vlogs', img: 'img/a5.jpg', last: '🏔 Echo Peak trek, day 4', unread: '', premium: true, muted: true },
      { name: 'Shorts', img: 'img/a2.jpg', last: '4.2K followers', join: true },
      { name: 'Music', img: 'img/a4.jpg', last: '2.1K followers', join: true },
      { name: 'Cooking', img: 'img/a6.jpg', last: '1.3K followers', join: true },
      { name: 'Sci-fi', img: 'img/a7.jpg', last: '6.8K followers', join: true, premium: true },
      { name: 'Nature', img: 'img/a8.jpg', last: '8.7K followers', join: true }
    ];
    return {
      accent,
      chats: list.map((c) => ({ ...c, unread: c.unread || '', join: !!c.join, premium: !!c.premium, badge: accent })),
      nav: tabs.map(([label, href, icon]) => ({ label, href, icon, color: label === 'Channels' ? accent : '#A0A0AB' }))
    };
  }
}
</script>
</body>
</html>
