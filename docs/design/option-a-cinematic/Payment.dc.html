<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flixvault · Payment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0C}
a{color:#FF9A4D}a:hover{color:#FFB37A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0A0C; color: #F4F4F6; font-family: Inter, system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; top: -120px; left: 50%; width: 460px; height: 460px; margin-left: -230px; border-radius: 50%; background: radial-gradient(circle, rgba(34,197,94,0.22), rgba(34,197,94,0) 65%)"></div>

  <header style="position: relative; display: flex; align-items: center; padding: 14px 14px 0">
    <a href="Premium.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #141418; border: 1px solid #26262E; color: #F4F4F6; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <h1 style="flex: 1; margin: 0; text-align: center; font-size: 16px; font-weight: 600; padding-right: 44px">Payment</h1>
  </header>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; padding: 40px 24px 0; text-align: center">
    <span style="width: 84px; height: 84px; border-radius: 50%; background: #22C55E; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 40px rgba(34,197,94,0.45)">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#04210F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
    </span>
    <h2 style="margin: 20px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">Gold plan is active</h2>
    <p style="margin: 6px 0 0; font-size: 14px; color: #A1A1AA">Enjoy full videos until 20 Dec 2026</p>
  </div>

  <div style="position: relative; margin: 26px 20px 0; padding: 16px; border-radius: 18px; background: #141418; border: 1px solid #26262E">
    <div style="display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0"><span style="color: #A1A1AA">Plan</span><span style="font-weight: 600">Gold · 30 days</span></div>
    <div style="display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0"><span style="color: #A1A1AA">Amount</span><span style="font-weight: 600">₹259</span></div>
    <div style="display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0"><span style="color: #A1A1AA">Paid with</span><span style="font-weight: 600">UPI</span></div>
    <div style="display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0"><span style="color: #A1A1AA">Reference</span><span style="font-weight: 600; font-variant-numeric: tabular-nums">4021 8833 1290</span></div>
  </div>

  <div style="position: relative; margin: 14px 20px 0; padding: 16px; border-radius: 18px; background: #141418; border: 1px solid #26262E">
    <p style="margin: 0 0 12px; font-size: 13px; font-weight: 600; color: #A1A1AA">Status</p>
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; padding: 6px 0">
        <span style="width: 24px; height: 24px; border-radius: 50%; background: #22C55E; display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#04210F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
        </span>
        <span style="flex: 1; font-size: 14px">{{s.label}}</span>
        <span style="font-size: 12px; color: #8A8A94">{{s.time}}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 24px">
    <a href="Main.dc.html" style="height: 54px; border-radius: 16px; background: {{accent}}; color: #1A1005; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Start watching</a>
    <p style="margin: 12px 0 0; text-align: center; font-size: 12px; color: #8A8A94">Still pending after 10 minutes? <a href="#" style="text-decoration: none; font-weight: 600">Contact support</a></p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF7A1A","options":["#FF7A1A","#FF5A36","#F5B400","#7C5CFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#FF7A1A',
      steps: [
        { label: 'Payment sent from UPI app', time: '9:41 PM' },
        { label: 'Payment confirmed', time: '9:42 PM' },
        { label: 'Plan activated', time: '9:42 PM' }
      ]
    };
  }
}
</script>
</body>
</html>
