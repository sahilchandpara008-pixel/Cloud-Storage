<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flixvault · Explore</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0C}
a{color:#FF9A4D}a:hover{color:#FFB37A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0A0C; color: #F4F4F6; font-family: Inter, system-ui, sans-serif; box-sizing: border-box">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 34px; height: 34px; border-radius: 10px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1005" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V8"></path><path d="M8.5 11.5 12 8l3.5 3.5"></path><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 11a3.5 3.5 0 0 0 1 7z"></path></svg>
      </div>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.02em">Flixvault</span>
    </div>
    <div style="display: flex; gap: 8px">
      <button aria-label="Search" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #26262E; background: #141418; color: #F4F4F6; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      </button>
    </div>
  </header>

  <nav aria-label="Categories" style="display: flex; gap: 8px; padding: 6px 20px 14px; overflow: hidden">
    <a href="#" style="flex: none; padding: 9px 16px; border-radius: 999px; background: #F4F4F6; color: #0A0A0C; font-size: 14px; font-weight: 600; text-decoration: none">All</a>
    <a href="#" style="flex: none; padding: 9px 16px; border-radius: 999px; background: #17171C; border: 1px solid #26262E; color: #D4D4D8; font-size: 14px; font-weight: 500; text-decoration: none">Web series</a>
    <a href="#" style="flex: none; padding: 9px 16px; border-radius: 999px; background: #17171C; border: 1px solid #26262E; color: #D4D4D8; font-size: 14px; font-weight: 500; text-decoration: none">Short films</a>
    <a href="#" style="flex: none; padding: 9px 16px; border-radius: 999px; background: #17171C; border: 1px solid #26262E; color: #D4D4D8; font-size: 14px; font-weight: 500; text-decoration: none">Comedy</a>
  </nav>

  <section aria-label="Featured" style="padding: 0 20px">
    <div style="position: relative; height: 214px; border-radius: 20px; overflow: hidden; background: #1D1A20 url(img/h1.jpg) center/cover; border: 1px solid #26262E">
      <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px; background: linear-gradient(to top, rgba(10,10,12,0.95) 55%, rgba(10,10,12,0)); display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="padding: 3px 8px; border-radius: 6px; background: {{accent}}; color: #1A1005; font-size: 11px; font-weight: 700">PREMIUM</span>
          <span style="font-size: 12px; color: #A1A1AA">Web series · 8 videos</span>
        </div>
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Midnight Run</h1>
        <div style="display: flex; gap: 8px">
          <a href="Player.dc.html" style="flex: 1; height: 44px; border-radius: 12px; background: {{accent}}; color: #1A1005; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#1A1005" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"></path></svg>Watch preview</a>
          <a href="Channel.dc.html" style="flex: 1; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); color: #F4F4F6; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; text-decoration: none">Open channel</a>
        </div>
      </div>
    </div>
    <div style="display: flex; justify-content: center; gap: 6px; padding-top: 10px" aria-hidden="true">
      <span style="width: 18px; height: 6px; border-radius: 3px; background: {{accent}}"></span>
      <span style="width: 6px; height: 6px; border-radius: 3px; background: #3A3A44"></span>
      <span style="width: 6px; height: 6px; border-radius: 3px; background: #3A3A44"></span>
    </div>
  </section>

  <section aria-label="New on Flixvault" style="padding: 16px 0 0">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 20px 10px">
      <h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600">New on Flixvault</h2>
      <a href="#" style="font-size: 13px; text-decoration: none">See all</a>
    </div>
    <div style="display: flex; gap: 12px; padding: 0 20px; overflow: hidden">
      <sc-for list="{{posters}}" as="p" hint-placeholder-count="4">
        <a href="Post.dc.html" style="flex: none; width: 112px; text-decoration: none; color: #F4F4F6">
          <div style="position: relative; height: 160px; border-radius: 14px; background: #1E1B22 url({{p.img}}) center/cover; border: 1px solid #26262E">
            <sc-if value="{{p.premium}}" hint-placeholder-val="{{true}}">
              <span style="position: absolute; top: 8px; left: 8px; width: 24px; height: 24px; border-radius: 8px; background: {{accent}}; display: flex; align-items: center; justify-content: center" aria-label="Premium">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="#1A1005" aria-hidden="true"><path d="M3 18h18l-1.5-10-4.5 4-3-6-3 6-4.5-4z"></path></svg>
              </span>
            </sc-if>
            <span style="position: absolute; right: 8px; bottom: 8px; padding: 2px 6px; border-radius: 6px; background: rgba(0,0,0,0.7); font-size: 11px; color: #E4E4E7">{{p.time}}</span>
          </div>
          <p style="margin: 8px 0 0; font-size: 13px; font-weight: 500; line-height: 1.3">{{p.title}}</p>
          <p style="margin: 2px 0 0; font-size: 12px; color: #A1A1AA">{{p.channel}}</p>
        </a>
      </sc-for>
    </div>
  </section>

  <section aria-label="Popular channels" style="padding: 18px 0 0">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 20px 10px">
      <h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600">Popular channels</h2>
      <a href="Channels.dc.html" style="font-size: 13px; text-decoration: none">See all</a>
    </div>
    <div style="display: flex; gap: 16px; padding: 0 20px; overflow: hidden">
      <sc-for list="{{channels}}" as="c" hint-placeholder-count="5">
        <a href="Channel.dc.html" style="flex: none; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: #E4E4E7">
          <span style="width: 64px; height: 64px; border-radius: 50%; background: #2A2026 url({{c.img}}) center/cover; border: 2px solid {{accent}}"></span>
          <span style="font-size: 12px; white-space: nowrap">{{c.name}}</span>
        </a>
      </sc-for>
    </div>
  </section>

  <nav aria-label="Main" style="position: absolute; left: 12px; right: 12px; bottom: 14px; height: 68px; border-radius: 22px; background: #141418; border: 1px solid #26262E; display: flex; align-items: center; justify-content: space-around; padding: 0 6px">
    <a href="Cloud.dc.html" style="width: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8A8A94; font-size: 11px; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 11a3.5 3.5 0 0 0 1 7z"></path></svg>Cloud</a>
    <a href="Feed.dc.html" style="width: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8A8A94; font-size: 11px; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"></path></svg>Feed</a>
    <a href="Main.dc.html" aria-current="page" style="width: 64px; height: 52px; border-radius: 16px; background: {{accent}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #1A1005; font-size: 11px; font-weight: 700; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Explore</a>
    <a href="Channels.dc.html" style="width: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8A8A94; font-size: 11px; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="m8 2 4 4 4-4"></path></svg>Channels</a>
    <a href="Profile.dc.html" style="width: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8A8A94; font-size: 11px; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF7A1A","options":["#FF7A1A","#FF5A36","#F5B400","#7C5CFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#FF7A1A',
      posters: [
        { title: 'Desert Line · Ep 1', channel: 'Web Series', time: '24:10', premium: true, img: 'img/p2.jpg' },
        { title: 'Deep Blue', channel: 'Shorts', time: '12:45', premium: false, img: 'img/p3.jpg' },
        { title: 'Echo Peak · Ep 3', channel: 'Web Series', time: '31:02', premium: true, img: 'img/p4.jpg' },
        { title: 'Drift', channel: 'Sci-fi', time: '18:30', premium: false, img: 'img/p5.jpg' }
      ],
      channels: [
        { name: 'Web Series', img: 'img/a1.jpg' },
        { name: 'Shorts', img: 'img/a2.jpg' },
        { name: 'Comedy', img: 'img/a3.jpg' },
        { name: 'Music', img: 'img/a4.jpg' },
        { name: 'Vlogs', img: 'img/a5.jpg' }
      ]
    };
  }
}
</script>
</body>
</html>
