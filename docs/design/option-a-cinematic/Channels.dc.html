<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flixvault · Channels</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0C}
a{color:#FF9A4D}a:hover{color:#FFB37A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0A0C; color: #F4F4F6; font-family: Inter, system-ui, sans-serif">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 12px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Channels</h1>
    <a href="#" style="height: 40px; padding: 0 14px; border-radius: 12px; background: #17171C; border: 1px solid #26262E; color: #F4F4F6; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; text-decoration: none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Create</a>
  </header>

  <div style="padding: 0 20px 12px">
    <label style="height: 48px; border-radius: 14px; background: #141418; border: 1px solid #26262E; display: flex; align-items: center; gap: 10px; padding: 0 14px; color: #8A8A94">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input placeholder="Search channels" aria-label="Search channels" style="flex: 1; border: 0; outline: 0; background: transparent; color: #F4F4F6; font: inherit; font-size: 15px">
    </label>
  </div>

  <div role="tablist" aria-label="Channel lists" style="display: flex; gap: 6px; margin: 0 20px 14px; padding: 4px; border-radius: 14px; background: #141418; border: 1px solid #26262E">
    <button role="tab" aria-selected="true" style="flex: 1; height: 40px; border: 0; border-radius: 10px; background: #F4F4F6; color: #0A0A0C; font: inherit; font-size: 14px; font-weight: 600">Discover</button>
    <button role="tab" aria-selected="false" style="flex: 1; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #A1A1AA; font: inherit; font-size: 14px; font-weight: 500">Joined · 3</button>
  </div>

  <ul style="list-style: none; margin: 0; padding: 0 20px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{channels}}" as="c" hint-placeholder-count="6">
      <li style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: #141418; border: 1px solid #1F1F25">
        <a href="Channel.dc.html" style="display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; text-decoration: none; color: #F4F4F6">
          <span style="flex: none; width: 52px; height: 52px; border-radius: 16px; background: #2A2026 url({{c.img}}) center/cover"></span>
          <span style="min-width: 0">
            <span style="display: block; font-size: 15px; font-weight: 600">{{c.name}}</span>
            <span style="display: block; margin-top: 2px; font-size: 12px; color: #A1A1AA">{{c.followers}} followers · {{c.videos}} videos</span>
          </span>
        </a>
        <sc-if value="{{c.joined}}" hint-placeholder-val="{{false}}">
          <button style="height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid #3A3A44; background: transparent; color: #D4D4D8; font: inherit; font-size: 13px; font-weight: 600">Joined</button>
        </sc-if>
        <sc-if value="{{c.notJoined}}" hint-placeholder-val="{{true}}">
          <button style="height: 36px; padding: 0 16px; border-radius: 10px; border: 0; background: {{accent}}; color: #1A1005; font: inherit; font-size: 13px; font-weight: 700">Join</button>
        </sc-if>
      </li>
    </sc-for>
  </ul>

  <nav aria-label="Main" style="position: absolute; left: 12px; right: 12px; bottom: 14px; height: 68px; border-radius: 22px; background: #141418; border: 1px solid #26262E; display: flex; align-items: center; justify-content: space-around; padding: 0 6px">
    <a href="Cloud.dc.html" style="width: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8A8A94; font-size: 11px; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 11a3.5 3.5 0 0 0 1 7z"></path></svg>Cloud</a>
    <a href="Feed.dc.html" style="width: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8A8A94; font-size: 11px; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"></path></svg>Feed</a>
    <a href="Main.dc.html" style="width: 64px; height: 52px; border-radius: 16px; background: #1F1F25; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #D4D4D8; font-size: 11px; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Explore</a>
    <a href="Channels.dc.html" aria-current="page" style="width: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{accent}}; font-size: 11px; font-weight: 700; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="m8 2 4 4 4-4"></path></svg>Channels</a>
    <a href="Profile.dc.html" style="width: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8A8A94; font-size: 11px; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF7A1A","options":["#FF7A1A","#FF5A36","#F5B400","#7C5CFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      { name: 'Web Series', followers: '15K', videos: 24, img: 'img/a1.jpg', joined: true },
      { name: 'Shorts', followers: '4.2K', videos: 61, img: 'img/a2.jpg', joined: false },
      { name: 'Comedy', followers: '9.8K', videos: 33, img: 'img/a3.jpg', joined: true },
      { name: 'Music', followers: '2.1K', videos: 18, img: 'img/a4.jpg', joined: false },
      { name: 'Travel Vlogs', followers: '6.4K', videos: 40, img: 'img/a5.jpg', joined: true },
      { name: 'Cooking', followers: '1.3K', videos: 12, img: 'img/a6.jpg', joined: false }
    ];
    return {
      accent: this.props.accent ?? '#FF7A1A',
      channels: list.map((c) => ({ ...c, notJoined: !c.joined }))
    };
  }
}
</script>
</body>
</html>
